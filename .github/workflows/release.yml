name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, or empty to only build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  installers:
    name: Installers (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - arch: arm64
            target: aarch64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version sync
        run: pnpm version:check
      - name: Build installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          bundles="$BUNDLES"
          if [[ "$version" == *-* ]]; then
            bundles=nsis
          fi
          pnpm tauri build --target "$TARGET" --bundles "$bundles"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installers-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a version tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Release notes
        run: node scripts/release-notes.ts "$RELEASE_TAG" > release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/release-assets"
          mkdir -p "$staging"
          find installers -type f \( -name '*.exe' -o -name '*.msi' \) -exec cp -t "$staging" {} +
          mapfile -t installers < <(find "$staging" -type f -printf '%f\n' | sort)
          if (( ${#installers[@]} == 0 )); then
            echo "no installers to publish" >&2
            exit 1
          fi
          cp scripts/install.ps1 "$staging/install.ps1"
          (cd "$staging" && sha256sum -- "${installers[@]}" install.ps1 > SHA256SUMS)
          cat "$staging/SHA256SUMS"
          files=("$staging"/*)
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --verify-tag "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
