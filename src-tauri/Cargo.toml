[package]
name = "plimsoll"
version = "0.1.0"
description = "A tiny Windows tray app for Claude plan limits"
authors = ["Haikal Mumtaz"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "plimsoll_lib"
path = "src/lib.rs"

[[bin]]
name = "plimsoll"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
